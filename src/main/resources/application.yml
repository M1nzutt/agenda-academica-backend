server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  application:
    name: agenda-academica
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agenda_academica}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
